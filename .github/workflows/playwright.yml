name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Needed for the GitHub Pages deployment step below.
permissions:
  contents: read
  pages: write
  id-token: write

# Prevents overlapping Pages deployments if two pushes land close together —
# GitHub rejects/races concurrent deploys to the same Pages site otherwise.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      # allure-commandline needs a JRE. ubuntu-latest currently ships one
      # preinstalled, but relying on that implicitly is fragile — pin it
      # explicitly so report generation doesn't silently break if GitHub
      # changes the runner image later.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      # Only chromium is installed here — CI currently runs chromium-only
      # for speed. Full cross-browser coverage (firefox, webkit) can be run
      # locally via `npm run test` (no --project filter), or added as a
      # separate scheduled workflow later if needed — no such workflow
      # exists yet as of this file.
      - name: Install Playwright Browsers (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          LOGIN_USERNAME: ${{ secrets.LOGIN_USERNAME }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
          SECURITY_TEST_EMAIL: ${{ secrets.SECURITY_TEST_EMAIL }}
          SECURITY_TEST_PASSWORD: ${{ secrets.SECURITY_TEST_PASSWORD }}
          SECONDARY_ACCOUNT_EMAIL: ${{ secrets.SECONDARY_ACCOUNT_EMAIL }}
          SECONDARY_ACCOUNT_PASSWORD: ${{ secrets.SECONDARY_ACCOUNT_PASSWORD }}
        run: npx playwright test --project=chromium --grep @regression

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Tells Allure who/what actually ran this — populates the
      # "Executors" panel on the report, which was empty when run locally.
      - name: Write Allure executor info
        if: ${{ !cancelled() }}
        run: |
          mkdir -p allure-results
          cat > allure-results/executor.json << EOF_INNER
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildOrder": ${{ github.run_number }},
            "buildName": "Run #${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "../${{ github.run_number }}/"
          }
          EOF_INNER

      # GitHub Pages deployments completely replace the site's contents on
      # every deploy — unlike the Allure Jenkins Plugin, which manages
      # build history internally, there's no persistent storage here
      # holding the previous run's history/ folder. Without this, Trend
      # data can never accumulate no matter how many times CI runs. Fix:
      # pull the previous run's history files directly from the live
      # Pages site (that site IS the last report, so its history/ files
      # are already publicly there) before generating the new one.
      # `|| true` on each line means a first-ever run (no history yet,
      # 404s expected) doesn't fail the step.
      - name: Restore previous Allure history for Trend data
        if: ${{ !cancelled() }}
        run: |
          mkdir -p allure-results/history
          BASE="https://abdelrhman-kamel.github.io/playwright-ecommerce-automation/history"
          curl -sf "$BASE/history.json" -o allure-results/history/history.json || true
          curl -sf "$BASE/history-trend.json" -o allure-results/history/history-trend.json || true
          curl -sf "$BASE/duration-trend.json" -o allure-results/history/duration-trend.json || true
          curl -sf "$BASE/retry-trend.json" -o allure-results/history/retry-trend.json || true
          curl -sf "$BASE/categories-trend.json" -o allure-results/history/categories-trend.json || true

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run allure:generate

      - name: Upload Allure report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Deploy Allure report to GitHub Pages
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

  deploy-pages:
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
